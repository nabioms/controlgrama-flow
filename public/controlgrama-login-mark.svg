<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">ControlGrama</title>
<desc id="desc">Símbolo ControlGrama com fundo transparente</desc>
<defs>
  <linearGradient id="green" x1="92" y1="72" x2="390" y2="430" gradientUnits="userSpaceOnUse">
    <stop stop-color="#B8FF38"/>
    <stop offset=".45" stop-color="#48E63C"/>
    <stop offset="1" stop-color="#079447"/>
  </linearGradient>
  <linearGradient id="green2" x1="170" y1="310" x2="390" y2="455" gradientUnits="userSpaceOnUse">
    <stop stop-color="#A8FF2E"/>
    <stop offset=".55" stop-color="#36D83D"/>
    <stop offset="1" stop-color="#078B43"/>
  </linearGradient>
  <linearGradient id="white" x1="250" y1="150" x2="250" y2="300" gradientUnits="userSpaceOnUse">
    <stop stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#DCE7E1"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0B7C3D" flood-opacity=".16"/>
  </filter>
</defs>

<g filter="url(#shadow)">
  <!-- large transparent-background C / control arc -->
  <path d="M377 117C336 82 283 66 229 73C139 84 74 153 69 239C65 310 99 372 158 411L199 365C161 339 137 295 137 245C137 180 187 129 250 129C282 129 311 140 334 160L294 199H422V70Z" fill="url(#green)"/>

  <!-- central check -->
  <path d="M145 251L228 334L415 145V216L228 404L145 321Z" fill="url(#green)" stroke="#9AFF35" stroke-width="3" stroke-linejoin="round"/>

  <!-- management bars -->
  <path d="M202 244V190L232 161V272Z" fill="url(#white)"/>
  <path d="M252 292V144L282 114V321Z" fill="url(#white)"/>
  <path d="M302 335V95L332 65V365Z" fill="url(#white)"/>

  <!-- lower field / leaf strokes -->
  <path d="M112 371C165 398 222 411 286 411C340 411 389 398 430 374C395 425 341 451 279 451C215 451 156 426 112 389Z" fill="url(#green2)"/>
  <path d="M104 437C155 465 215 478 280 478C345 478 402 463 448 436" fill="none" stroke="url(#green)" stroke-width="7" stroke-linecap="round"/>
</g>
</svg>